<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Mis Videojuegos{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #eee; margin: 0; }
        header { background: #1f1f1f; padding: 1rem 2rem; }
        header a { color: #4fc3f7; text-decoration: none; margin-right: 1rem; }
        main { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
        .card { background: #1f1f1f; border-radius: 8px; overflow: hidden; }
        .card img { width: 100%; height: 140px; object-fit: cover; background: #333; }
        .card-body { padding: 1rem; }
        .card a { color: #4fc3f7; text-decoration: none; }
        .badge { background: #333; border-radius: 4px; padding: 2px 8px; font-size: 0.8rem; }
        .btn { display: inline-block; background: #4fc3f7; color: #000; padding: 0.6rem 1.2rem;
               border-radius: 6px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <a href="{% url 'juegos_app:crear' %}">Crear juego</a>  
        <a href="{% url 'juegos_app:lista' %}">Volver al listado</a>
        <a href="{% url 'juegos_app:lista' %}">🎮 Inicio</a>
        <a href="{% url 'juegos_app:lista' %}?tipo=instalable">Para instalar</a>
        <a href="{% url 'juegos_app:lista' %}?tipo=web">Jugar en la web</a>
    </header>
    <main>
        {% block contenido %}{% endblock %}
    </main>
</body>
</html>
